<style>
/* 1. ページ全体の背景（部屋の壁紙のようなイメージ） */
body {
    margin: 0;
    padding: 20px;
    background-color: #eae3d2; /* 落ち着いた壁紙風のベージュ */
    font-family: var(--font-sans);
    display: flex;
    flex-direction: column;
    align-items: center;
    /* ページ全体の高さを画面いっぱいにして、フッターを一番下に置く */
    box-sizing: border-box;
    min-height: 100vh;
    --page-pad: 20px;
}

/* 共通フッターは、ページの余白（--page-pad）を打ち消して画面の端から端まで広げる */
.site-footer {
    margin: auto calc(-1 * var(--page-pad)) calc(-1 * var(--page-pad));
    width: calc(100% + 2 * var(--page-pad));
}

/* ページのタイトル */
h1 {
    color: #4a3319;
    text-shadow: 1px 1px 1px rgba(255,255,255,0.6);
    margin-bottom: 20px;
    font-size: 1.8rem;
    text-align: center;
}

/* 2. 木の額縁（ウォールナット）
   左右は縦の木目、上下は横の木目の板を、四隅で斜めに突き合わせた（留め継ぎの）額縁にする。
   素材画像は tools/make_textures.py で作成。 */
.board-frame {
    --frame: 22px;                       /* 額縁の太さ */
    position: relative;
    box-sizing: border-box;
    width: fit-content;                  /* 中のピンの点数に合わせて大きさが決まる */
    max-width: min(100%, 1000px);        /* PCでの最大幅 */
    padding: var(--frame);
    margin-bottom: 48px;                 /* フッターとの間隔 */
    border-radius: 3px;
    /* 左右の板：縦の木目＋光の当たり方（左が明るく、右が暗い） */
    background:
        linear-gradient(90deg,
            rgba(255, 236, 210, 0.16) 0, rgba(255, 236, 210, 0) var(--frame),
            rgba(0, 0, 0, 0) calc(100% - var(--frame)), rgba(0, 0, 0, 0.28) 100%),
        url("/assets/textures/wood-v.webp") center / 256px auto,
        #4f2f1a;
    /* 壁に掛かっている影 */
    box-shadow:
        0 1px 0 1px rgba(30, 15, 5, 0.6),
        0 6px 10px rgba(40, 22, 8, 0.28),
        0 22px 40px -10px rgba(40, 22, 8, 0.45);
}

/* 上下の板（横の木目）。台形に切り抜いて、四隅を斜めに合わせる */
.board-frame::before,
.board-frame::after {
    content: "";
    position: absolute;
    left: 0;
    right: 0;
    height: var(--frame);
    pointer-events: none;
}
.board-frame::before {
    top: 0;
    border-radius: 3px 3px 0 0;
    clip-path: polygon(0 0, 100% 0, calc(100% - var(--frame)) 100%, var(--frame) 100%);
    background:
        linear-gradient(rgba(255, 240, 220, 0.24), rgba(255, 240, 220, 0.04)),
        url("/assets/textures/wood-h.webp") center / auto 256px,
        #5a361e;
}
.board-frame::after {
    bottom: 0;
    border-radius: 0 0 3px 3px;
    clip-path: polygon(var(--frame) 0, calc(100% - var(--frame)) 0, 100% 100%, 0 100%);
    background:
        linear-gradient(rgba(0, 0, 0, 0.05), rgba(0, 0, 0, 0.32)),
        url("/assets/textures/wood-h.webp") center / auto 256px,
        #4a2b17;
}

/* 3. コルクボード本体 */
.pins-container {
    box-sizing: border-box;
    position: relative;
    z-index: 1;                           /* 上下の板の影の上にピンを出す */
    --pin-size: 130px; /* ピン1つ分の幅 */
    --pin-cols: 5;     /* 列数（JavaScriptが点数と画面幅から自動計算して上書き） */

    /* コルクの質感（細かい粒・色むら）＋ふちがわずかに暗い */
    background:
        radial-gradient(ellipse at 50% 40%, rgba(0, 0, 0, 0) 55%, rgba(70, 38, 12, 0.22) 100%),
        url("/assets/textures/cork.webp") 0 0 / 256px 256px,
        #b98a58;
    /* 額縁の内側の段差と、額縁がコルクに落とす影 */
    box-shadow:
        0 0 0 2px #2c170a,
        inset 0 0 0 1px rgba(0, 0, 0, 0.35),
        inset 3px 5px 10px rgba(40, 20, 5, 0.45),
        inset -1px -1px 4px rgba(40, 20, 5, 0.25);

    /* ピンバッジを並べる設定（点数と画面幅に合わせて列数が変わる） */
    display: grid;
    grid-template-columns: repeat(var(--pin-cols), var(--pin-size));
    gap: 28px 20px; /* ピン同士の間隔（縦・横） */
    padding: 32px 26px; /* 額縁とピンの間の余白 */
}

/* 4. コルクボードに刺さっているピンバッジ1つ
   --rot（傾き）と --dx / --dy（少しのずれ）は、ピンごとに JavaScript が Id から決める。
   同じピンは毎回同じ角度で表示される。 */
.pins-item {
    --rot: 0deg;
    --dx: 0px;
    --dy: 0px;
    text-decoration: none;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
    cursor: pointer;
    transform: translate(var(--dx), var(--dy));
    -webkit-tap-highlight-color: transparent;
}

/* ピンバッジ本体：コルクに密着した濃い影＋少し離れた柔らかい影で「刺さって浮いている」厚みを出す。
   背景を透明にした（切り抜いた）ピン画像だと、影がピンの形どおりに落ちて一番リアルになる。 */
.pins-item img {
    width: 100%;
    height: auto;
    max-width: 110px; /* ピンバッジが大きくなりすぎないように制限 */
    transform: rotate(var(--rot));
    filter:
        drop-shadow(0 1px 0.6px rgba(35, 16, 4, 0.6))
        drop-shadow(2px 5px 4px rgba(35, 16, 4, 0.32));
    transition: transform 0.25s ease, filter 0.25s ease;
}

/* 触れたとき：ピンを少し引き抜いたように浮き上がる */
.pins-item:hover img,
.pins-item:focus-visible img {
    transform: translateY(-4px) rotate(var(--rot)) scale(1.05);
    filter:
        drop-shadow(0 2px 1px rgba(35, 16, 4, 0.45))
        drop-shadow(5px 14px 10px rgba(35, 16, 4, 0.3));
}
.pins-item:focus-visible {
    outline: 2px solid #fff6e0;
    outline-offset: 6px;
    border-radius: 6px;
}

/* 5. バッジの名前：コルクに添えた小さな紙のラベル */
.pins-item p {
    margin: 10px 0 0 0;
    max-width: 100%;
    font-size: 10.5px;
    font-weight: bold;
    color: #4a3319;
    background-color: #f4ecdc;
    padding: 3px 8px;
    border-radius: 1px;
    text-align: center;
    box-shadow: 0 1px 2px rgba(35, 16, 4, 0.35);
    transform: rotate(calc(var(--rot) * -0.3));
    word-break: break-all; /* 文字が枠からはみ出さないように */
}

/* 6. ピンが0点の時：押しピンで留めたメモ（準備中） */
.pins-empty {
    grid-column: 1 / -1;
    justify-self: center;
    align-self: center;
    position: relative;
    margin: 0;
    padding: 26px 26px 20px;
    max-width: 240px;
    background: #fbf6ea;
    color: #4a3319;
    font-size: 14px;
    font-weight: bold;
    line-height: 1.6;
    text-align: center;
    transform: rotate(-2.5deg);
    box-shadow:
        0 1px 1px rgba(35, 16, 4, 0.35),
        2px 8px 10px -4px rgba(35, 16, 4, 0.4);
}
/* 押しピンの頭（赤いプラスチック） */
.pins-empty::before {
    content: "";
    position: absolute;
    top: 7px;
    left: 50%;
    width: 14px;
    height: 14px;
    margin-left: -7px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #ff8a7a 0, #d8362a 45%, #8f1d14 100%);
    box-shadow: 1px 3px 3px rgba(35, 16, 4, 0.45);
}
.pins-empty[hidden] {
    display: none;
}

.board-frame.is-empty {
    width: 100%;
}
.pins-container.is-empty {
    grid-template-columns: 1fr; /* 0点の時は列数の計算をしないので1列にする */
    min-height: 220px;
}

/* 画面幅の自動調整 */
@media (max-width: 600px) {
    body {
        padding: 10px;
        --page-pad: 10px;
    }
    /* 右上に固定した「ホームに戻る」ボタンがピンに重ならないよう、見出しとボードの間を空ける */
    h1 {
        margin-bottom: 60px;
    }
    .board-frame {
        --frame: 14px; /* 額縁を少し細くして画面を広く使う */
    }
    .pins-container {
        padding: 24px 16px;
        gap: 22px 14px;
        --pin-size: 90px; /* スマホでのピン1つ分の幅 */
    }
    .pins-item img {
        max-width: 80px;
    }
    .pins-item p {
        font-size: 10px;
        padding: 2px 6px;
    }
}

/* 動きを減らす設定の人には、浮き上がりのアニメーションをしない */
@media (prefers-reduced-motion: reduce) {
    .pins-item img {
        transition: none;
    }
}
</style>
</head>

<script>
  // 保存された言語を安全に読み込む（読めない環境では 'ja'）
  function getSavedLanguage() {
      try {
          return localStorage.getItem('selectedLanguage') || 'ja';
      } catch (e) {
          return 'ja';
      }
  }

  // ピンの点数と画面幅から、行ごとの数がそろう列数を計算する
  // 例: PCで10点 → 5列×2行 / スマホで10点 → 3列×4行
  function layoutPinBoard() {
      const board = document.getElementById('pins');
      if (!board) return;
      const frameEl = document.getElementById('pin-board');
      const count = board.querySelectorAll('.pins-item').length;
      board.classList.toggle('is-empty', count === 0);
      if (frameEl) frameEl.classList.toggle('is-empty', count === 0);
      const emptyMessage = document.getElementById('pins-empty');
      if (emptyMessage) emptyMessage.hidden = count !== 0;
      if (count === 0) return;

      const style = getComputedStyle(board);
      const pinSize = parseFloat(style.getPropertyValue('--pin-size')) || 130;
      const gap = parseFloat(style.columnGap) || 20;
      const frameStyle = frameEl ? getComputedStyle(frameEl) : null;
      const frame = (parseFloat(style.borderLeftWidth) + parseFloat(style.paddingLeft)) * 2
          + (frameStyle ? parseFloat(frameStyle.paddingLeft) * 2 : 0);
      const bodyStyle = getComputedStyle(document.body);
      const available = Math.min(1000,
          document.body.clientWidth - parseFloat(bodyStyle.paddingLeft) - parseFloat(bodyStyle.paddingRight));

      const maxCols = Math.max(1, Math.floor((available - frame + gap) / (pinSize + gap)));
      const rows = Math.ceil(count / maxCols);
      const cols = Math.ceil(count / rows);
      board.style.setProperty('--pin-cols', cols);
  }
  window.addEventListener('resize', layoutPinBoard);

  // ピンごとの「刺さり方」（傾き・少しのずれ）を Id から決める。
  // 乱数ではなく Id から計算するので、同じピンはいつ見ても同じ角度・位置になる。
  function pinPose(id) {
      let h = 2166136261;
      for (const ch of String(id)) {
          h ^= ch.codePointAt(0);
          h = Math.imul(h, 16777619);
      }
      const next = () => {
          h = Math.imul(h ^ (h >>> 15), 2246822507);
          h = Math.imul(h ^ (h >>> 13), 3266489909);
          h ^= h >>> 16;
          return (h >>> 0) / 4294967296; // 0〜1
      };
      return {
          rot: (next() * 2 - 1) * 9,   // -9〜+9度
          dx: (next() * 2 - 1) * 6,    // 左右に ±6px
          dy: (next() * 2 - 1) * 6     // 上下に ±6px
      };
  }

  // data.json の元画像パス（例: /images/_DSC1106.JPG）から、
  // tools/optimize_images.py が作った軽量版（例: /images/opt/DSC1106-480.webp）のパスを作る
  function optimizedImage(path, width) {
      const m = String(path || '').match(/^(.*\/)?images\/([^/]+)\.(jpe?g|png)$/i);
      if (!m) return path;
      return `${m[1] || ''}images/opt/${m[2].replace(/^_+/, '')}-${width}.webp`;
  }

  // 軽量版がまだ無い場合は、元画像を表示する
  function setImageWithFallback(img, original, width) {
      img.onerror = () => { img.onerror = null; img.src = original; };
      img.src = optimizedImage(original, width);
  }

  document.addEventListener("DOMContentLoaded", () => {
      // 1. ブラウザが記憶している言語を読み込む
      const currentLang = getSavedLanguage();

      // 2. ページ全体の data-属性がついたテキスト（タイトルなど）を現在の言語に書き換える
      document.querySelectorAll(`[data-${currentLang}]`).forEach(el => {
          el.innerText = el.getAttribute(`data-${currentLang}`);
      });

      // 3. ページ全体のリンク（URL）も記憶された言語に一括書き換え
      document.querySelectorAll('.nav-link').forEach(link => {
          const targetUrl = link.getAttribute(`data-url-${currentLang}`);
          if (targetUrl) {
              link.href = targetUrl;
          }
      });

      // 4. JSONファイルを読み込む
      fetch('data.json')
        .then(response => response.json())
        .then(data => {
          const pinsContainer = document.getElementById('pins');

          if (!pinsContainer) {
            console.error("エラー: id='pins'のタグが見つかりません。");
            return;
          }

          // "Draft": true のピン（仮データ・下書き）は表示しない
          data.filter(pin => !pin.Draft).forEach(pin => {
            const item = document.createElement('a');
            item.className = 'pins-item';

            // 「Id」を使って、詳細ページ（detail.pins.html）のリンクを作る
            item.href = `detail.pins.html?id=${encodeURIComponent(pin.Id)}`;

            const pose = pinPose(pin.Id);
            item.style.setProperty('--rot', pose.rot.toFixed(1) + 'deg');
            item.style.setProperty('--dx', pose.dx.toFixed(1) + 'px');
            item.style.setProperty('--dy', pose.dy.toFixed(1) + 'px');

            // ★大文字の「Image」と「Name」を確実に受け取る
            // バッジ名多言語化（JSON内に ja や en を用意)
            // pin[currentLang] があればそれを使い、無ければ直下の Name を使う安全な設計にしています
            const displayName = (pin[currentLang] && pin[currentLang].Name) ? pin[currentLang].Name : pin.Name;

            // 文字や画像パスはHTMLとして解釈させず、そのまま安全に入れる
            const img = document.createElement('img');
            setImageWithFallback(img, pin.Image, 480);
            img.loading = 'lazy';
            img.alt = displayName;
            const label = document.createElement('p');
            label.textContent = displayName;

            item.append(img, label);
            pinsContainer.appendChild(item);
          });

          // 並べ終わったら、点数に合わせてボードを整える
          layoutPinBoard();
        })
        .catch(error => console.error('データの読み込みに失敗しました:', error));
  });
</script>
