<style>
    /* ボタンの配置と見た目 */
.menu-btn {
    position: fixed;
    top: 20px;
    right: 20px;
    display: flex;
    height: 60px;
    width: 60px;
    justify-content: center;
    align-items: center;
    z-index: 90;
    background-color: #333;
    border-radius: 50%;
    cursor: pointer;
}
.menu-btn span, .menu-btn span::before, .menu-btn span::after {
    content: '';
    display: block;
    height: 3px;
    width: 25px;
    border-radius: 3px;
    background-color: #fff;
    position: absolute;
}
.menu-btn span::before { bottom: 8px; }
.menu-btn span::after { top: 8px; }

/* チェックボックスは隠す */
#menu-btn-check { display: none; }

/* チェックが入ったらメニューを表示 */
#menu-btn-check:checked ~ .menu-content { right: 0; }

/* メニューの画面 */
.menu-content {
    width: 300px;
    height: 100%;
    position: fixed;
    top: 0;
    right: -300px; /* 最初は画面の外に隠す */
    z-index: 80;
    background-color: #f4f4f4;
    transition: all 0.5s;
    box-shadow: -2px 0 5px rgba(0,0,0,0.1);
    padding-top: 80px;
}
.menu-content ul { list-style: none; padding: 0; }
.menu-content ul li a {
    display: block;
    width: 100%;
    padding: 15px 20px;
    color: #333;
    text-decoration: none;
    border-bottom: 1px solid #ddd;
}
</style>

    <style>
        /* ページ全体の高さを画面いっぱいにして、フッターを一番下に置く */
        body { min-height: calc(100vh - 16px); display: flex; flex-direction: column; }
        .detail-container { padding: 20px; max-width: 600px; margin: 0 auto; width: 100%; box-sizing: border-box; flex: 1; }
        /* 共通フッターは、ページの余白（8px）を打ち消して画面の端から端まで広げる */

        .detail-main { display: flex; flex-direction: column; align-items: center; gap: 20px; }
        .detail-main img { max-width: 100%; height: auto; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .info-table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        .info-table th, .info-table td { border: 1px solid #ddd; padding: 12px; text-align: left; }
        .info-table th { background-color: #f8f9fa; width: 40%; }
    </style>
</head>
<body>

</div>



    <!-- partial:home-button -->
    <a href="/index.html" class="home-fab"
       data-ja="← ホームに戻る" data-en="← Back to Home" data-fr="← Retour à l'accueil" data-zh="← 返回首页">← ホームに戻る</a>
    <!-- /partial:home-button -->

    <div class="detail-container">
        <!-- 戻るボタンも言語切り替えに対応 -->
        <a href="/pins/pins.html" class="back-link" data-ja="← ピンボードに戻る" data-en="← Back to Pin Board" data-fr="← Retour au tableau des broches" data-zh="← 返回徽章板">
            ← ピンボードに戻る
        </a>
        
        <div id="detail-content" class="detail-main">
            <!-- 詳細データ -->
        </div>
    </div>

    <script>
        // 保存された言語を安全に読み込む（読めない環境では 'ja'）
        function getSavedLanguage() {
            try {
                return localStorage.getItem('selectedLanguage') || 'ja';
            } catch (e) {
                return 'ja';
            }
        }

        // 文字をHTMLとして解釈させないための変換（URLなどから来た値を安全に表示する）
        function escapeHTML(value) {
            return String(value ?? '').replace(/[&<>"']/g, ch => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
            }[ch]));
        }


        // data.json の元画像パス（例: /images/_DSC1106.JPG）から、
        // tools/optimize_images.py が作った軽量版（例: /images/opt/DSC1106-480.webp）のパスを作る
        function optimizedImage(path, width) {
            const m = String(path || '').match(/^(.*\/)?images\/([^/]+)\.(jpe?g|png)$/i);
            if (!m) return path;
            return `${m[1] || ''}images/opt/${m[2].replace(/^_+/, '')}-${width}.webp`;
        }

        // 軽量版がまだ無い場合は、元画像を表示する
        function setImageWithFallback(img, original, width) {
            img.onerror = () => { img.onerror = null; img.src = original; };
            img.src = optimizedImage(original, width);
        }

        document.addEventListener("DOMContentLoaded", () => {
            // 1. ブラウザの記憶から言語を読み込む（なければ 'ja'）
            const currentLang = getSavedLanguage();

            // 2. ページ全体の文字を記憶された言語に一括書き換え
            document.querySelectorAll(`[data-${currentLang}]`).forEach(el => {
                el.innerText = el.getAttribute(`data-${currentLang}`);
            });

            // 3. ページ全体のリンク（URL）も記憶された言語に一括書き換え
            document.querySelectorAll('.nav-link').forEach(link => {
                const targetUrl = link.getAttribute(`data-url-${currentLang}`);
                if (targetUrl) {
                    link.href = targetUrl;
                }
            });

            // 4. URLから「?id=0001」の「0001」の部分を取り出す
            const pinId = new URLSearchParams(window.location.search).get('id');

            // 各言語のテーブル項目名（ヘッダー）
            const labels = {
                ja: { year: "リリース", char: "キャラクター", size: "エディションサイズ", memo: "メモ" },
                en: { year: "Release Year", char: "Character", size: "Edition Size", memo: "Memo" },
                fr: { year: "Année de sortie", char: "Personnage", size: "Taille de l'édition", memo: "Mémo" },
                zh: { year: "发售年份", char: "角色", size: "限量大小", memo: "备注" }
            };

            fetch('data.json')
                .then(response => response.json())
                .then(data => {
                    // "Draft": true のピン（仮データ・下書き）は表示しない
                    const pin = data.find(item => item.Id == pinId && !item.Draft);
                    const content = document.getElementById('detail-content');

                    if (pin) {
                        // data.json の項目（Name, Image など大文字）を基本にし、
                        // 言語別データ（例: pin.en）があればその項目だけ上書きする
                        const pinData = Object.assign({}, pin, pin[currentLang] || {});
                        const label = labels[currentLang] || labels['ja'];

                        content.innerHTML = `
                            <img alt="${escapeHTML(pinData.Name)}">
                            <h2>${escapeHTML(pinData.Name)}</h2>
                            <table class="info-table">
                                <tr><th>${label.year}</th><td>${escapeHTML(pinData.ReleaseYear || '-')}</td></tr>
                                <tr><th>${label.char}</th><td>${escapeHTML(pinData.Character || '-')}</td></tr>
                                <tr><th>${label.size}</th><td>${escapeHTML(pinData.Editionsize || '-')}</td></tr>
                                <tr><th>${label.memo}</th><td>${escapeHTML(pinData.Memo || '-')}</td></tr>
                            </table>
                        `;
                        setImageWithFallback(content.querySelector('img'), pin.Image, 960);
                    } else {
                        // IDが一致するデータが見つからなかった場合
                        content.innerHTML = `
                            <p style="color:red; font-weight:bold;">
                                ピンバッジのデータが見つかりませんでした。<br>
                                (探したID: ${escapeHTML(pinId)})
                            </p>
                        `;
                    }
                })
                .catch(error => console.error('データの読み込みに失敗しました:', error));
        });
    </script>
