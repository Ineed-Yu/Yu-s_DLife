# ブログの予約公開
# 1時間ごとに記事を組み立て直し、公開日時を過ぎた予約記事をサイトに出します。
# 公開されたら、その記事の入稿ページ（Issue）にお知らせして閉じます。
# 手動で今すぐ動かすこともできます（Actions →「ブログの予約公開」→「Run workflow」）。
# ※ 公開リポジトリでは、60日間リポジトリに動きがないと、この定期実行は GitHub により自動で止まります。
name: ブログの予約公開

on:
  schedule:
    - cron: "7 * * * *"   # 毎時7分（混み合う0分を避ける）
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pages: write

concurrency:
  group: blog-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 記事を組み立て直す
        run: |
          python3 tools/apply_partials.py
          python3 tools/build_blog.py --report "$RUNNER_TEMP/new.json"

      - name: main に保存
        id: push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # 存在するものだけ追加する（記事が1本も無いと content/ などがまだ無く、git add が失敗するため）
          for path in blog en fr zh sitemap.xml content; do
            if [ -e "$path" ]; then git add -A -- "$path"; fi
          done
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -q -m "blog: 予約記事を公開"
          for i in 1 2 3; do
            git pull -q --rebase origin main && git push -q origin HEAD:main && break
            sleep 5
          done
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: サイトの再構築を依頼
        if: steps.push.outputs.changed == 'true'
        run: gh api -X POST "repos/${GITHUB_REPOSITORY}/pages/builds" --silent || echo "::warning::再構築の依頼に失敗しました。"

      - name: 入稿ページにお知らせして閉じる
        if: steps.push.outputs.changed == 'true'
        run: |
          python3 - "$RUNNER_TEMP/new.json" <<'PY' > "$RUNNER_TEMP/notices.tsv"
          import json, sys
          for p in json.load(open(sys.argv[1])):
              if isinstance(p.get("source_issue"), int):
                  print(f'{p["source_issue"]}\t{p["url"]}')
          PY
          while IFS=$'\t' read -r num url; do
            gh issue comment "$num" --repo "$GITHUB_REPOSITORY" --body "✅ **予約していた記事を公開しました。** ${url}" || true
            gh issue close "$num" --repo "$GITHUB_REPOSITORY" --reason completed || true
          done < "$RUNNER_TEMP/notices.tsv"
