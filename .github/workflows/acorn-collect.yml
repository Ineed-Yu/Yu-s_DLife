# Acorn Club：クラリスの新着グッズ情報を自動で集める
# - 2時間ごと（と手動）：取得元（content/acorn/sources.json）から集め、タイムライン（acorn-club/news.json）を更新して main に保存
# - 過去の記事（2004年〜）も毎回少しずつ調べて取り込む（手動で backfill を選ぶと最初から調べ直す）
# - 収集の仕組みや取得元を変える PR：実際の取得元から「試し取得」だけを行い、取得元ごとの結果を表示（書き換えない）
name: Acorn Club の自動収集

on:
  schedule:
    - cron: "37 */2 * * *"   # 2時間ごと（混み合う0分を避ける）
  workflow_dispatch:
    inputs:
      backfill:
        description: "過去の記事を最初から調べ直す（ふだんは2時間ごとに自動で少しずつ進むので不要）"
        type: boolean
        default: false
  pull_request:
    paths:
      - "tools/acorn_news.py"
      - "content/acorn/sources.json"
      - "acorn-club/history.json"
      - ".github/workflows/acorn-collect.yml"

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('acorn-check-{0}', github.ref) || 'blog-publish' }}
  cancel-in-progress: false

jobs:
  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: 試し取得（ファイルは書き換えない）
        run: python3 tools/acorn_news.py collect --dry-run
      - name: 過去分の試し取得（直近2期間だけ・ファイルは書き換えない）
        run: python3 tools/acorn_news.py backfill --dry-run --windows 2
      - name: 記事の画像の試し取得（ファイルは書き換えない）
        run: python3 tools/acorn_news.py images --dry-run --limit 8
      - name: タイムラインが最新か確認
        run: python3 tools/acorn_news.py build --check

  collect:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # X（有料の API）はキーを登録するまで動かない。月の上限は Variables の X_MONTHLY_POST_LIMIT（未設定なら 1300 件）
      - name: 新着情報を集める
        env:
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          X_MONTHLY_POST_LIMIT: ${{ vars.X_MONTHLY_POST_LIMIT }}
          # 見出しの自動翻訳（Claude API。ブログの翻訳と共通のキー。未登録なら翻訳しない）。月の上限は ACORN_TRANSLATE_MONTHLY_LIMIT（既定 2000 件）
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ACORN_TRANSLATE_MODEL: ${{ vars.ACORN_TRANSLATE_MODEL }}
          BLOG_TRANSLATE_MODEL: ${{ vars.BLOG_TRANSLATE_MODEL }}
          ACORN_TRANSLATE_MONTHLY_LIMIT: ${{ vars.ACORN_TRANSLATE_MONTHLY_LIMIT }}
        run: python3 tools/acorn_news.py collect

      # 過去の記事は毎回4分まで少しずつ調べ、どこまで調べたかを残して次回に続ける（取得元が増えたときもその分を自動で）
      - name: 過去の記事を少しずつ取り込む
        env:
          RESET: ${{ github.event_name == 'workflow_dispatch' && inputs.backfill && 'true' || 'false' }}
        run: |
          if [ "$RESET" = "true" ]; then
            python3 tools/acorn_news.py backfill --reset --budget 600
          else
            python3 tools/acorn_news.py backfill --budget 240
          fi

      - name: main に保存
        id: push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for path in content/acorn acorn-club/news.json; do
            if [ -e "$path" ]; then git add -A -- "$path"; fi
          done
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -q -m "acorn: 新着情報を更新"
          for i in 1 2 3; do
            git pull -q --rebase origin main && git push -q origin HEAD:main && break
            sleep 5
          done
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: サイトの再構築を依頼
        if: steps.push.outputs.changed == 'true'
        run: gh api -X POST "repos/${GITHUB_REPOSITORY}/pages/builds" --silent || echo "::warning::再構築の依頼に失敗しました。"
