# Acorn Club：入力フォーム（Issues →「Acorn Club に情報を追加する」）からタイムラインに追加
# 動くのは、Issue の作成者が「リポジトリの持ち主」で、本文が Acorn の入力フォーム（「リンク（URL）」欄あり）のときだけです。
# 持ち主本人による送信のほか、持ち主のアカウントで動く Muse が作成・編集した Issue も対象です（2026-11-15 管理者決定）。
# 題名の「[Acorn]」は無くても動きます。送信した時点で管理者の承認とみなします。
# スクリプト側でも作成者の権限と「入稿の確認」のチェックを確かめます。
name: Acorn Club の手動追加

on:
  issues:
    types: [opened, edited, reopened]

permissions:
  contents: write
  issues: write
  pages: write

jobs:
  add:
    if: >-
      github.event.issue.user.login == github.repository_owner &&
      contains(github.event.issue.body, '### リンク（URL）')
    runs-on: ubuntu-latest
    # 他の自動処理と同時に main を書き換えないよう、1つずつ順番に動かす。
    # ここ（ジョブ）に書くのは、対象外の Issue の動きで待ちの自動処理が取り消されないようにするため。
    # それでも Issue が続けて作られると待ちが取り消されることがあるので、1回の処理で開いているフォームの Issue を全部拾う。
    concurrency:
      group: blog-publish
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ISSUE: ${{ github.event.issue.number }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # Issue の本文はシェルに埋め込まず、ファイルから Python で読む
      - name: タイムラインに追加（開いているフォームの Issue もまとめて）
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/issues?state=open&creator=${GITHUB_REPOSITORY_OWNER}&per_page=100" > "$RUNNER_TEMP/open.json"
          python3 tools/acorn_news.py add-all "$GITHUB_EVENT_PATH" --open "$RUNNER_TEMP/open.json" --owner "$GITHUB_REPOSITORY_OWNER" > "$RUNNER_TEMP/result.json"

      - name: main に保存
        id: push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for path in content/acorn acorn-club/news.json; do
            if [ -e "$path" ]; then git add -A -- "$path"; fi
          done
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -q -m "acorn: 手動追加 #${ISSUE} を反映"
          for i in 1 2 3; do
            git pull -q --rebase origin main && git push -q origin HEAD:main && break
            sleep 5
          done
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: サイトの再構築を依頼
        if: steps.push.outputs.changed == 'true'
        run: gh api -X POST "repos/${GITHUB_REPOSITORY}/pages/builds" --silent || echo "::warning::再構築の依頼に失敗しました。"

      - name: 結果をコメント
        if: always()
        run: |
          if [ "${{ job.status }}" != "success" ]; then
            printf '⚠️ **自動処理の途中でエラーが起きました。** 反映されていない可能性があります。\n\n詳細: %s/%s/actions/runs/%s\n' \
              "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" > "$RUNNER_TEMP/error.md"
            gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/error.md"
            exit 0
          fi
          python3 tools/acorn_news.py add-report "$RUNNER_TEMP/result.json" "$RUNNER_TEMP/report"
          for f in "$RUNNER_TEMP"/report/*.md; do
            [ -e "$f" ] || continue
            n="$(basename "$f" .md)"
            gh issue comment "$n" --repo "$GITHUB_REPOSITORY" --body-file "$f"
            if [ -e "$RUNNER_TEMP/report/$n.close" ]; then
              gh issue close "$n" --repo "$GITHUB_REPOSITORY" --reason completed || true
            fi
          done
