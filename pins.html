<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pin Badges</title>
    <style>
        .pins-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
            padding: 20px;
        }
        .pins-item {
            text-decoration: none;
            color: #333;
            text-align: center;
            border: 1px solid #eee;
            padding: 10px;
            border-radius: 8px;
            transition: transform 0.2s;
        }
        .pins-item:hover { transform: translateY(-5px); }
        .pins-item img { width: 100%; height: auto; border-radius: 4px; }
    </style>
</head>
<body>

    <!-- あなたが今やっている書き方に合わせて、data-属性でタイトルを用意 -->
    <h1 data-ja="ピンバッジ コレクション" data-en="Pin Badge Collection" data-fr="Collection de Badges" data-zh="徽章收藏">
        ピンバッジ コレクション
    </h1>

    <div id="pins" class="pins-container">
        <!-- ここにJavaScriptで自動的にバッジが追加されます -->
    </div>

    <script>
      // 1. ブラウザが記憶している言語を読み込む（なければ 'ja' をデフォルトにする）
      const currentLang = localStorage.getItem('selectedLanguage') || 'ja';

      // 2. タイトルなどのHTMLテキストを現在の言語に書き換える
      document.querySelectorAll('[data-' + currentLang + ']').forEach(el => {
          el.innerText = el.getAttribute('data-' + currentLang);
      });

      // 3. JSONファイルを読み込んでギャラリーを生成
      fetch('data.json')
        .then(response => response.json())
        .then(data => {
          const pins = document.getElementById('pins');
          
          data.forEach(pin => {
            const item = document.createElement('a');
            item.className = 'pins-item';
            
            // 次のページへはシンプルに遷移（URLパラメータは不要！）
            item.href = `detail.html?id=${pin.id}`; 
            
            // 現在の言語に応じたデータを取得（例: pin['ja'] や pin['en']）
            // フランス語(fr)や中国語(zh)のデータがJSONにまだ無い時のために、無ければ日本語を出す安全対策
            const pinData = pin[currentLang] || pin['ja'];
            
            item.innerHTML = `
              <img src="${pin.image}" alt="${pinData.name}">
              <p>${pinData.name}</p>
            `;
            pins.appendChild(item);
          });
        })
        .catch(error => console.error('データの読み込みに失敗しました:', error));
    </script>
</body>
</html>
