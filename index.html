<!DOCTYPE html>
<html lang="ja">

<lang-switch>
<div class="lang-switch-wrapper">
    <div class="lang-switch-box">
        <button onclick="switchLanguage('ja')" id="btn-ja" class="lang-btn active">JP</button>
        <button onclick="switchLanguage('en')" id="btn-en" class="lang-btn">EN</button>
        <button onclick="switchLanguage('fr')" id="btn-fr" class="lang-btn">FR</button>
        <button onclick="switchLanguage('zh')" id="btn-zh" class="lang-btn">ZH</button>
    </div>
</div>

<style>
  /* 言語切り替えタブ */
.lang-switch-wrapper {
    display: flex;
    justify-content: 0%;
    padding: 20px 0;
    width: 100%;
    position: relative;
    z-index: 10;
}

/* 🎯 1つの枠（カプセル）のデザイン */
.lang-switch-box {
    display: flex;
    background-color: rgba(255, 255, 255, 0.6); /* 背景 */
    backdrop-filter: blur(8px);                 /* エフェクト */
    padding: 4px;
    border-radius: 30px;                         /* 型 */
    border: 1px solid rgba(255, 255, 255, 0.4);   /* フチの線 */
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);   /* 影 */
}

/* 枠の中の各ボタンの共通デザイン */
.lang-btn {
    background: none;
    border: none;
    font-size: 12px;
    font-weight: bold;
    color: #777;                                 /* 選択されていない時 */
    cursor: pointer;
    padding: 8px 16px;
    border-radius: 20px;
    transition: all 0.5s ease;                   /* 切り替えエフェクト */
}

/* 🌟 タップされて「アクティブ」になった言語ボタンのデザイン */
.lang-btn.active {
    background-color: #fff;                      /* 選択時 */
    color: #222;                                 
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);    /* 浮かせる */
}
</style>  

<body>
    
<script>
function switchLanguage(lang) {
    // 1. 枠の中にあるすべての言語ボタン（.lang-btn）から一旦 active クラスを消す
    const buttons = document.querySelectorAll('.lang-btn');
    buttons.forEach(btn => btn.classList.remove('active'));

    // 2. タップされた言語のボタンだけに active クラスをつけて白くする
    document.getElementById('btn-' + lang).classList.add('active');

    // 3. ページ内の「data-〇〇」属性を持っている要素をすべて探す
    // 例：data-ja を持っている要素（＝多言語化対象のテキスト）
    const elements = document.querySelectorAll('[data-ja]');
    
    // 4. 指定された言語のテキストを引っ張ってきて、その場で書き換える
    elements.forEach(el => {
        const translatedText = el.getAttribute('data-' + lang);
        
        // もし将来、まだ翻訳テキストを書いていない項目（空っぽ）があっても、
        // 画面が空白にならないように元の日本語（data-ja）を保険で表示する優しい設計
        if (translatedText) {
            el.innerHTML = translatedText;
        } else {
            el.innerHTML = el.getAttribute('data-ja');
        }
    });
}
</script>


</body>
