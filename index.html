<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yu's DLife</title>
    
    <style>
        /* 1. サイト全体のベース設定 */
        body {
            margin: 0;
            padding: 0;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            color: #333;
            min-height: 100vh;
            
            /* ⭐ サイト全体の固定背景（基本のベース背景） */
            background-image: url("images/back.jpg"); 
            background-size: cover;
            background-position: center;
            background-attachment: fixed; /* スクロールしても動かない */
        }

        /* 🌐 Google言語切り替えタブ（最上部に綺麗に配置） */
        #google_translate_element {
            text-align: center;
            padding: 15px 0;
            background-color: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(5px); /* 背景をほんのりぼかすトレンドデザイン */
            width: 100%;
        }
        .goog-te-banner-frame.skiptranslate { display: none !important; }
        body { top: 0px !important; }

        /* 2. 中央のコンテンツコンテナ（共通） */
        .container {
            max-width: 580px;
            margin: 0 auto;
            text-align: center;
            box-sizing: border-box;
        }

        /* 3. 🎯 各セクションの共通設定（芸術点を上げた統合CSS） */
        .section {
            position: relative;
            padding: 60px 20px; /* 上下に少し余白を持たせて背景を魅せる */
            overflow: hidden;
        }

        /* 透過背景を作るための裏地（全セクション共通） */
        .section::before {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            z-index: -1; /* 文字の裏側に配置 */
            background-size: cover;
            background-position: center;
            background-attachment: fixed; /* スクロールしても背景がその場に固定されるプロパティ */
        }

        /* ---------------------------------------------
         * 🏰 各セクション固有の背景・透過率設定（ここだけ分ければOK！）
         * --------------------------------------------- */
        
        /* セクション1: プロフィール (Disney背景) */
        .sec-profile::before {
            background-image: url("images/clarice.shn.dlr.001.JPG"); 
            background-position: 50% 30%; 
            opacity: 0.85;
        }

        /* セクション2: ブログ */
        .sec-blog::before {
            background-image: url("images/clarice.wmc.shdl.001.JPG"); 
            background-position: 50% 50%;
            opacity: 0.85;
        }

        /* セクション3: SNS */
        .sec-sns::before {
            background-image: url("images/back.JPG");
            background-position: 50% 90%;
            opacity: 1;
        }


        /* 4. 各種パーツのデザイン（重複や無駄を排除） */
        .profile-icon {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #fff;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        }

        .profile-name {
            font-size: 24px;
            font-weight: bold;
            margin: 15px 0 5px 0;
        }

        .profile-tag {
            font-size: 14px;
            color: #555;
            margin-bottom: 15px;
            font-weight: bold;
        }

        .profile-bio {
            font-size: 14px;
            line-height: 1.7;
            background-color: rgba(255, 255, 255, 0.75); 
            padding: 20px;
            border-radius: 16px;
            text-align: center; /* 中央寄せに */
            display: inline-block; /* 中央寄せの中に左寄せを同居させる */
            max-width: 100%;
        }

        /* 横並びリンクボタンのラッパー */
        .link-wrapper {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
            width: 100%;
            margin-top: 20px;
        }

        /* 横並びリンクボタン本体 */
        .link-button {
            display: flex;
            flex-direction: column;
            align-items: center;
            flex: 1;
            min-width: 140px;
            max-width: 180px;
            background-color: rgba(255, 255, 255, 0.92);
            color: #333;
            text-decoration: none;
            padding: 16px 8px;
            border-radius: 16px;
            font-weight: bold;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            transition: all 0.3s ease;
            box-sizing: border-box;
        }

        .link-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 15px rgba(0, 0, 0, 0.12);
            background-color: #fff;
        }
        
        .link-sub {
            display: block;
            font-size: 11px;
            color: #777;
            font-weight: normal;
            margin-top: 4px;
        }
    </style>
</head>
<body>

    <!-- 🌐 翻訳タブ -->
    <div id="google_translate_element"></div>

    <!-- 🏰 セクション1：プロフィールエリア -->
    <div class="section sec-profile">
        <div class="container">
            <img src="images/clarice.wmc.shdl.001.JPG" alt="profile icon" class="profile-icon">
            <h1 class="profile-name">Yu</h1>
            <div class="profile-tag">ハッピーオタクライフ</div>
            <div class="profile-bio">
                Disneyが大好きなYuのオタクライフを詰め込んだページです。不定期更新中。<br>
                同じ好きを通してたくさんのシェアハピを目指してます。<br><br>
                📍 Pin Trading & Collector<br>
                🏰 Past AP : TDR HKDL DLP<br>
                ✨ Now AP : SHDL Diamond
            </div>
        </div>
    </div>

    <!-- 🎬 セクション2：ブログ＆映画エリア -->
    <div class="section sec-blog">
        <div class="container">
            <div class="link-wrapper">
                <a href="https://note.com" target="_blank" rel="noopener noreferrer" class="link-button">
                    note
                    <span class="link-sub">言語化してる</span>
                </a>
                <a href="https://filmarks.com" target="_blank" rel="noopener noreferrer" class="link-button">
                    Filmarks
                    <span class="link-sub">映画レビュー</span>
                </a>
                <a href="https://hatenablog.jp" target="_blank" rel="noopener noreferrer" class="link-button">
                    はてなブログ
                    <span class="link-sub">Yuのこれって何？</span>
                </a>
            </div>
        </div>
    </div>

    <!-- 📱 セクション3：SNSエリア -->
    <div class="section sec-sns">
        <div class="container">
            <div class="link-wrapper">
                <a href="https://twitter.com..." target="_blank" rel="noopener noreferrer" class="link-button">
                    Twitter
                    <span class="link-sub">つぶやき</span>
                </a>
                <a href="https://instagram.com..." target="_blank" rel="noopener noreferrer" class="link-button">
                    Instagram
                    <span class="link-sub">写真</span>
                </a>
                <a href="https://youtube.com/..." target="_blank" rel="noopener noreferrer" class="link-button">
                    YouTube
                    <span class="link-sub">動画</span>
                </a>
            </div>
        </div>
    </div>

    <!-- Google翻訳スクリプト -->
    <script type="text/javascript">
    function googleTranslateElementInit() {
        new google.translate.TranslateElement({
            pageLanguage: 'ja',
            layout: google.translate.TranslateElement.InlineLayout.SIMPLE,
            autoDisplay: true
        }, 'google_translate_element');
    }
    </script>
    <script type="text/javascript" src="//://google.com"></script>

</body>
</html>
