    <style>
         /* 全体の基本設定（背景はここでは指定しない） */
        body {
            margin: 0;
            padding: 0;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            color: #333;
        }
        /* 2. プロフィール全体を囲う中央の透明なコンテナ */
        .container {
            max-width: 580px; /* スマホやPCで見た時にちょうどいい横幅 */
            margin: 0 auto;
            padding: 40px 20px;
            text-align: center;
            box-sizing: border-box;
        }

        /* 3. 丸のプロフィール画像 */
        .profile-icon {
            width: 100px;
            height: 100px;
            border-radius: 50%; /* 正方形を綺麗な丸にするプロパティ */
            object-fit: cover;
            border: 3px solid #fff; /* 白いフチ */
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        /* 4. 名前やテキスト */
        .profile-name {
            font-size: 20px;
            font-weight: bold;
            margin: 15px 0 5px 0;
        }
        .profile-tag {
            font-size: 14px;
            color: #666;
            margin-bottom: 15px;
        }
        .profile-bio {
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 30px;
            background-color: rgba(255, 255, 255, 0.7); /* 文字の背景を少し白くして読みやすく */
            padding: 15px;
            border-radius: 12px;
        }

        /* 5.リンクボタン */
        .link-button {
            display: block;
            background-color: rgba(255, 255, 255, 0.95); /* ボタンの背景色（白） */
            color: #333;
            text-decoration: none; /* 下線を消す */
            padding: 5px;
            margin-bottom: 10px;
            border-radius: 15px; /* 角を丸くして可愛い印象に */
            font-weight: bold;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            transition: all 0.2s ease; /* マウスを載せた時の滑らかな動き */
        }
        /* ボタンにマウスを載せた（スマホでタップした）ときの動き */
        .link-button:hover {
            transform: translateY(-3px); /* 少し上に浮き上がる */
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.1);
            background-color: #fff;
        }
        
        .link-sub {
            display: block;
            font-size: 10px;
            color: #888;
            font-weight: normal;
            margin-top: 2px;
        }
    </style>
</head>

        .section-profile, .section-blog, .section-sns {
